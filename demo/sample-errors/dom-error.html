<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM Error Demo</title>
    <style>
      .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
      }
      .error-message {
        color: red;
        font-weight: bold;
      }
      .user-info {
        background: #f0f0f0;
        padding: 10px;
        margin: 10px 0;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>DOM Error Demo</h1>
      <p>This page demonstrates common DOM manipulation errors.</p>

      <div id="userContainer">
        <div class="user-info">
          <h3>User Information</h3>
          <p id="userName">Loading...</p>
          <p id="userEmail">Loading...</p>
          <p id="userStatus">Loading...</p>
        </div>
      </div>

      <button id="loadUserBtn">Load User Data</button>
      <button id="clearDataBtn">Clear Data</button>

      <div id="errorContainer" class="error-message" style="display: none">An error occurred!</div>
    </div>

    <script>
      // dom-error.js - Demonstrates DOM manipulation errors
      // This file contains intentional DOM-related bugs

      document.addEventListener('DOMContentLoaded', function () {
        const loadButton = document.getElementById('loadUserBtn');
        const clearButton = document.getElementById('clearDataBtn');
        const errorContainer = document.getElementById('errorContainer');

        loadButton.addEventListener('click', loadUserData);
        clearButton.addEventListener('click', clearUserData);
      });

      async function loadUserData() {
        try {
          // Bug: Trying to get element that doesn't exist
          const userNameElement = document.getElementById('userName');
          const userEmailElement = document.getElementById('userEmail');
          const userStatusElement = document.getElementById('userStatus');
          const loadingElement = document.getElementById('loadingSpinner'); // This element doesn't exist!

          // Simulate API call
          const response = await fetch('https://jsonplaceholder.typicode.com/users/1');
          const userData = await response.json();

          // Bug: Not checking if elements exist before accessing properties
          userNameElement.textContent = userData.name;
          userEmailElement.textContent = userData.email;
          userStatusElement.textContent = 'Active';

          // Bug: Trying to modify non-existent element
          loadingElement.style.display = 'none'; // Will throw error
        } catch (error) {
          console.error('Error loading user data:', error);

          // Bug: Trying to access errorContainer that might not be defined
          errorContainer.style.display = 'block'; // errorContainer might be undefined
          errorContainer.textContent = 'Failed to load user data: ' + error.message;
        }
      }

      function clearUserData() {
        // Bug: Using querySelector that returns null
        const userContainer = document.querySelector('#userContainer');
        const userInfo = userContainer.querySelector('.user-info'); // This exists
        const nonExistentElement = userContainer.querySelector('.non-existent-class'); // This returns null

        // Bug: Calling methods on null element
        userInfo.innerHTML =
          '<h3>User Information</h3><p id="userName">Cleared</p><p id="userEmail">Cleared</p><p id="userStatus">Cleared</p>';
        nonExistentElement.innerHTML = 'This will never be reached'; // Will throw error

        // Bug: Accessing properties of null
        console.log('Non-existent element text:', nonExistentElement.textContent); // Will throw error
      }

      // Bug: Calling function that doesn't exist
      setTimeout(function () {
        try {
          nonExistentFunction(); // This function doesn't exist
        } catch (error) {
          console.error('Undefined function error:', error);

          // Bug: Trying to access DOM element after it might have been removed
          const errorDiv = document.getElementById('errorContainer');
          if (errorDiv) {
            errorDiv.textContent = 'An undefined function was called!';
            errorDiv.style.display = 'block';
          }
        }
      }, 2000);
    </script>
  </body>
</html>
